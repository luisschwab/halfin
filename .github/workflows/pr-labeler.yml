name: PR Labeler

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Semver]
    types: [completed]

permissions: {}

jobs:
    semver:
        name: API Break Label
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            pull-requests: write

        steps:
            - name: Download Semver State
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  name: semver-break

            - name: Toggle API Break Label
              shell: bash
              env:
                  GH_REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  issue_number=$(head -n1 semver-break)
                  exit_code=$(tail -n1 semver-break)
                  toggle=$([ "$exit_code" -eq 0 ] && echo "--remove-label" || echo "--add-label")
                  gh pr edit "$issue_number" "$toggle" "API Break"

    pr-labeler:
        name: PR Labeler
        if: github.event_name == 'pull_request_target'
        runs-on: ubuntu-slim
        permissions:
            pull-requests: write
        steps:
            - name: Label PR according to modified files
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const changedFiles = await github.paginate(
                        github.rest.pulls.listFiles,
                        {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.issue.number,
                        }
                      );

                      // Paths of all the managed labels
                      const filePathsToLabels = {
                        '.github/': 'ci',
                        'sha256/': 'sha256',

                        'src/node/bitcoind/': 'M-bitcoind',
                        'src/node/btcd/': 'M-btcd',
                        'src/node/florestad/': 'M-florestad',
                        'src/node/utreexod/': 'M-utreexod',

                        'src/indexer/electrsd/': 'M-electrsd',
                        'src/indexer/mempool_electrsd': 'M-mempool-electrsd',
                        'src/indexer/electrumxd/': 'M-electrumxd',
                      };

                      const labelsToAdd = new Set();

                      changedFiles.forEach(file => {
                        const filePath = file.filename;
                        for (const [path, label] of Object.entries(filePathsToLabels)) {
                          if (filePath.startsWith(path)) {
                            labelsToAdd.add(label);
                            break;
                          }
                        }
                      });

                      const allKnownLabels = new Set(Object.values(filePathsToLabels));

                      // Add new managed labels
                      if (labelsToAdd.size > 0) {
                        await github.rest.issues.addLabels({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          labels: Array.from(labelsToAdd)
                        });
                      }

                      // Remove any managed labels that no longer apply
                      const currentLabels = (await github.rest.issues.listLabelsOnIssue({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      })).data.map(label => label.name);

                      for (const label of currentLabels) {
                        if (allKnownLabels.has(label) && !labelsToAdd.has(label)) {
                          try {
                            await github.rest.issues.removeLabel({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: context.issue.number,
                              name: label,
                            });
                          } catch (e) {
                            // Ignore 404 in case the label was already removed externally
                            if (e.status !== 404) throw e;
                          }
                        }
                      }
