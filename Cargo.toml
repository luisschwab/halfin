[package]
version = "0.3.6"
name = "halfin"
description = "A {regtest} bitcoin node runner 🏃‍♂️"
authors = ["Luis Schwab <dev@luisschwab.net"]
repository = "https://github.com/luisschwab/halfin"
documentation = "https://docs.rs/halfin"
keywords = ["bitcoin", "runner", "testing"]
license = "MIT OR Apache-2.0"
readme = "README.md"
edition = "2024"
rust-version = "1.85.0" # MSRV

[dependencies]
corepc-client = { version = "0.13.0", features = ["client-sync"] }
tempfile = { version = "3", default-features = false }
serde_json = { version = "1.0.117", default-features = false }
which = { version = "8", default-features = false }

[build-dependencies]
anyhow = { version = "1.0.66" }
bitcoin_hashes = { version = "0.20", features = ["hex"] }
flate2 = { version = "1.1" }
bitreq = { version = "0.3.5", features = ["https"] }
tar = { version = "0.4.45" }
zip = { version = "7.2", default-features = false, features = ["bzip2", "deflate"] }

[dev-dependencies]
env_logger = { version = "0.11", default-features = false }

[features]
default = ["bitcoind_31_0", "utreexod_0_5_2"]
bitcoind_31_0 = []
utreexod_0_5_2 = []

[lints.clippy]
let-and-return = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.rbmt.test]
exclude_features = [
    "bitcoind_31_0",
    "utreexod_0_5_2"
]
exact_features = [
    ["bitcoind_31_0", "utreexod_0_5_2"],
]

# Allow packages of different versions in the dependency tree.
[package.metadata.rbmt.lint]
allowed_duplicates = [
    "anyhow",
    "base64",
    "bitcoin-internals",
    "bitcoin_hashes",
    "bitreq",
    "hex-conservative",
    "libc",
    "memchr",
    "rustix",
    "windows-sys"
]

[package.metadata.rbmt.toolchains]
stable = "1.95.0"
nightly = "nightly-2026-05-19"
