[package]
version = "0.3.7"
name = "halfin"
description = "A {regtest} bitcoin node runner 🏃‍♂️"
authors = ["Luis Schwab <dev@luisschwab.net"]
repository = "https://github.com/luisschwab/halfin"
documentation = "https://docs.rs/halfin"
keywords = ["bitcoin", "runner", "testing"]
license = "MIT OR Apache-2.0"
readme = "README.md"
edition = "2024"
rust-version = "1.85.0" # MSRV

[features]
default = ["bitcoind_31_0", "utreexod_0_5_2"]
bitcoind_31_0 = []
utreexod_0_5_2 = []

[dependencies]
corepc-client = { version = "=0.15.0", features = ["client-sync"] }
tempfile = { version = "=3.27.0", default-features = false }
serde_json = { version = "=1.0.150", default-features = false }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
which = { version = "=8.0.2", default-features = false }

[build-dependencies]
anyhow = { version = "=1.0.102" }
bitcoin_hashes = { version = "=1.0.0", features = ["hex"] }
flate2 = { version = "=1.1.9" }
bitreq = { version = "=0.3.7", features = ["https"] }
tar = { version = "=0.4.46" }
zip = { version = "=7.2.0", default-features = false, features = ["bzip2", "deflate"] }

[dev-dependencies]
tracing-subscriber = { version = "=0.3.23", features = ["fmt"] }
lazy_static = "1.4.0" # blame: tracing-subsbcriber

[lints.clippy]
let-and-return = "allow"

[package.metadata.rbmt.toolchains]
stable = "1.95.0"
nightly = "nightly-2026-05-26"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.rbmt.test]
exclude_features = [
    "bitcoind_31_0",
    "utreexod_0_5_2"
]
exact_features = [
    ["bitcoind_31_0", "utreexod_0_5_2"],
]

# Allow packages of different versions in the dependency tree.
[package.metadata.rbmt.lint]
allowed_duplicates = [
    "anyhow",
    "base64",
    "bitcoin-internals",
    "bitcoin_hashes",
    "bitreq",
    "hex-conservative",
    "libc",
    "memchr",
    "once_cell",
    "rustix",
    "windows-sys"
]
